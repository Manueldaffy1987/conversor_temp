<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Conversor educativo de temperaturas entre Celsius, Fahrenheit y Kelvin.">
<title>Conversor educativo de temperaturas</title>
<style>
:root{--azul:#2563eb;--azul-oscuro:#1e3a8a;--texto:#172033;--suave:#5b6474;--borde:#dbe4f0;--error:#b42318;--frio:#0ea5e9;--templado:#16a34a;--caliente:#ef4444}
*{box-sizing:border-box}body{min-height:100vh;margin:0;padding:24px;display:grid;place-items:center;color:var(--texto);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(circle at 15% 15%,#ffffff80,transparent 28%),linear-gradient(135deg,#8ed8ff,#c4d7ff 45%,#ffd1a8)}
button,input,select{font:inherit}.app{width:min(100%,920px);padding:clamp(20px,4vw,40px);border:1px solid #ffffffb8;border-radius:28px;background:#ffffffe6;box-shadow:0 24px 60px #192b502e;backdrop-filter:blur(12px)}
header{text-align:center;margin-bottom:26px}h1{margin:0 0 8px;font-size:clamp(1.8rem,5vw,2.7rem)}header p{margin:auto;max-width:650px;color:var(--suave);line-height:1.6}.tarjeta{padding:clamp(18px,3vw,28px);border:1px solid var(--borde);border-radius:22px;background:#fff;box-shadow:0 12px 30px #2a3f6714}
.controles{display:grid;grid-template-columns:1.3fr 1fr auto 1fr;gap:14px;align-items:end}.campo{display:grid;gap:7px}label{font-weight:750}input,select{width:100%;min-height:48px;padding:11px 13px;color:var(--texto);border:2px solid var(--borde);border-radius:12px;background:#fbfdff;transition:.2s}
input:focus,select:focus,button:focus-visible{outline:3px solid #2563eb47;outline-offset:2px;border-color:var(--azul)}.boton{min-height:48px;padding:11px 18px;border:0;border-radius:12px;font-weight:800;cursor:pointer;transition:.18s}.boton:hover{transform:translateY(-2px);filter:brightness(1.03)}.boton:active{transform:scale(.98)}
.intercambiar{width:50px;padding:0;font-size:1.35rem;color:var(--azul-oscuro);background:#eaf1ff}.principal{color:#fff;background:linear-gradient(135deg,#2563eb,#5b45d8);box-shadow:0 10px 22px #2563eb40}.secundario{background:#edf1f7}.acciones{display:flex;gap:12px;justify-content:center;margin-top:20px;flex-wrap:wrap}.error{min-height:24px;margin:12px 0 0;color:var(--error);font-weight:700;text-align:center}
.resultado{display:none;margin-top:20px;overflow:hidden;border-left:7px solid var(--templado);animation:aparecer .35s ease}.resultado.visible{display:block}.resultado.frio{border-color:var(--frio);background:#f0faff}.resultado.templado{border-color:var(--templado);background:#f2fcf5}.resultado.caliente{border-color:var(--caliente);background:#fff5f3}.valores{display:flex;align-items:center;justify-content:center;gap:18px;flex-wrap:wrap;text-align:center}.valor{min-width:180px}.valor span{display:block;margin-bottom:5px;color:var(--suave);font-size:.9rem;font-weight:700;text-transform:uppercase}.valor strong{font-size:clamp(1.55rem,5vw,2.35rem)}.flecha{color:var(--azul);font-size:1.7rem}.explicacion{margin-top:20px;padding-top:18px;border-top:1px solid var(--borde);line-height:1.6}.formula{display:inline-block;margin:5px 0;padding:8px 12px;border-radius:9px;background:#ffffffbf;font-family:monospace;font-weight:800}.ejemplos{margin-top:20px}.ejemplos h2{text-align:center;font-size:1.05rem}.lista-ejemplos{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.ejemplo{min-height:42px;color:var(--azul-oscuro);background:#eef5ff;border:1px solid #cbdcff}.ayuda{text-align:center;color:var(--suave);font-size:.9rem}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@keyframes aparecer{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}@media(max-width:760px){.controles{grid-template-columns:1fr 1fr}.campo-valor{grid-column:1/-1}.intercambiar{grid-column:1/-1;width:100%}}@media(max-width:480px){body{padding:12px}.controles{grid-template-columns:1fr}.campo-valor,.intercambiar{grid-column:auto}.acciones .boton{width:100%}}
</style>
</head>
<body>
<main class="app">
<header><h1>🌡️ Conversor de temperaturas</h1><p>Convierte entre Celsius, Fahrenheit y Kelvin, y descubre la fórmula que hace posible cada cálculo.</p></header>
<section class="tarjeta" aria-labelledby="titulo"><h2 id="titulo" class="sr-only">Datos de conversión</h2>
<form id="formulario" novalidate><div class="controles">
<div class="campo campo-valor"><label for="temperatura">Temperatura</label><input id="temperatura" type="number" step="any" inputmode="decimal" placeholder="Ej. 25" aria-describedby="error" required></div>
<div class="campo"><label for="origen">Desde</label><select id="origen"><option value="C">Celsius (°C)</option><option value="F">Fahrenheit (°F)</option><option value="K">Kelvin (K)</option></select></div>
<button class="boton intercambiar" id="intercambiar" type="button" aria-label="Intercambiar unidades" title="Intercambiar unidades">⇄</button>
<div class="campo"><label for="destino">Hacia</label><select id="destino"><option value="F">Fahrenheit (°F)</option><option value="C">Celsius (°C)</option><option value="K">Kelvin (K)</option></select></div></div>
<p id="error" class="error" role="alert" aria-live="assertive"></p><div class="acciones"><button class="boton principal" type="submit">Convertir temperatura</button><button class="boton secundario" id="limpiar" type="button">Limpiar</button></div></form></section>
<section id="resultado" class="tarjeta resultado" aria-live="polite" aria-atomic="true"><div class="valores"><div class="valor"><span>Valor original</span><strong id="original"></strong></div><div class="flecha" aria-hidden="true">→</div><div class="valor"><span>Valor convertido</span><strong id="convertido"></strong></div></div><div class="explicacion"><strong>Fórmula utilizada</strong><br><span id="formula" class="formula"></span><p id="detalle"></p></div></section>
<section class="ejemplos"><h2>Prueba con un ejemplo</h2><div class="lista-ejemplos"><button class="boton ejemplo" data-valor="0" data-unidad="C">0 °C</button><button class="boton ejemplo" data-valor="100" data-unidad="C">100 °C</button><button class="boton ejemplo" data-valor="273.15" data-unidad="K">273,15 K</button></div></section><p class="ayuda">Consejo: también puedes presionar <strong>Enter</strong> para convertir.</p>
</main>
<script>
const $=id=>document.getElementById(id),formulario=$('formulario'),entrada=$('temperatura'),origen=$('origen'),destino=$('destino'),error=$('error'),resultado=$('resultado');
const simbolos={C:'°C',F:'°F',K:'K'},nombres={C:'Celsius',F:'Fahrenheit',K:'Kelvin'},minimos={C:-273.15,F:-459.67,K:0};
const aCelsius=(v,u)=>u==='F'?(v-32)*5/9:u==='K'?v-273.15:v;
const desdeCelsius=(v,u)=>u==='F'?v*9/5+32:u==='K'?v+273.15:v;
function formato(v){v=Math.abs(v)<.005?0:v;return v.toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2})}
function datosFormula(o,d){const f={'C-F':['°F = (°C × 9/5) + 32',v=>`(${formato(v)} × 9/5) + 32`],'C-K':['K = °C + 273,15',v=>`${formato(v)} + 273,15`],'F-C':['°C = (°F − 32) × 5/9',v=>`(${formato(v)} − 32) × 5/9`],'F-K':['K = (°F − 32) × 5/9 + 273,15',v=>`(${formato(v)} − 32) × 5/9 + 273,15`],'K-C':['°C = K − 273,15',v=>`${formato(v)} − 273,15`],'K-F':['°F = (K − 273,15) × 9/5 + 32',v=>`(${formato(v)} − 273,15) × 9/5 + 32`]};return f[`${o}-${d}`]||[`${simbolos[d]} = ${simbolos[o]}`,v=>formato(v)]}
function mostrarError(m){error.textContent=m;resultado.className='tarjeta resultado';entrada.setAttribute('aria-invalid','true')}
function convertir(){error.textContent='';entrada.removeAttribute('aria-invalid');if(entrada.value.trim()===''){mostrarError('Escribe una temperatura antes de convertir.');entrada.focus();return}const v=Number(entrada.value),o=origen.value,d=destino.value;if(!Number.isFinite(v)){mostrarError('Ingresa un número válido.');return}if(v<minimos[o]-1e-10){mostrarError(`Esa temperatura es inferior al cero absoluto (${formato(minimos[o])} ${simbolos[o]}).`);return}const c=aCelsius(v,o),r=desdeCelsius(c,d),[f,calc]=datosFormula(o,d),categoria=c<10?'frio':c<30?'templado':'caliente';$('original').textContent=`${formato(v)} ${simbolos[o]}`;$('convertido').textContent=`${formato(r)} ${simbolos[d]}`;$('formula').textContent=f;$('detalle').textContent=o===d?`Ambas unidades son ${nombres[o]}, por lo que el valor no cambia.`:`Sustituimos el valor en la fórmula: ${calc(v)} = ${formato(r)} ${simbolos[d]}.`;resultado.className=`tarjeta resultado visible ${categoria}`}
formulario.addEventListener('submit',e=>{e.preventDefault();convertir()});$('intercambiar').addEventListener('click',()=>{[origen.value,destino.value]=[destino.value,origen.value];entrada.value.trim()?convertir():entrada.focus()});$('limpiar').addEventListener('click',()=>{formulario.reset();origen.value='C';destino.value='F';error.textContent='';resultado.className='tarjeta resultado';entrada.removeAttribute('aria-invalid');entrada.focus()});document.querySelectorAll('.ejemplo').forEach(b=>b.addEventListener('click',()=>{entrada.value=b.dataset.valor;origen.value=b.dataset.unidad;destino.value=b.dataset.unidad==='C'?'F':'C';convertir()}));
</script>
</body>
</html>
